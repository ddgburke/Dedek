<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZERO COST — PKWU Project</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">


<style>

/* =========================
   BASIC
========================= */

:root{
    --cream:#f4f0e8;
    --paper:#fbf9f4;
    --beige:#e8dfd0;

    --dark:#303c34;
    --dark2:#202a24;

    --text:#202521;
    --muted:#777b74;

    --brown:#8a7458;
    --brown2:#b9a486;

    --line:#d8d0c3;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--cream);
    color:var(--text);
    font-family:"DM Sans",sans-serif;
    line-height:1.6;
    overflow-x:hidden;
}

img,
video{
    display:block;
    width:100%;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1180px,88%);
    margin:auto;
}

section{
    padding:120px 0;
}

.section-light{
    background:var(--cream);
}

.section-dark{
    background:var(--dark);
    color:#fffdf8;
}

.section-beige{
    background:var(--beige);
}

em{
    font-family:"Playfair Display",serif;
    font-style:italic;
    font-weight:400;
}


/* =========================
   NAVBAR
========================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;

    padding:0 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    z-index:999;

    background:rgba(244,240,232,.9);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(32,37,33,.08);
}

.logo{
    font-size:14px;
    font-weight:700;
    letter-spacing:4px;
}

.logo span{
    color:var(--brown);
}

.nav-links{
    display:flex;
    gap:32px;
}

.nav-links a{
    font-size:9px;
    letter-spacing:2px;
    color:#666b65;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--brown);
}

.nav-year{
    font-size:8px;
    letter-spacing:2px;
    color:#898c85;
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;

    padding:130px 6% 70px;

    display:grid;
    grid-template-columns:1.1fr .9fr;

    align-items:center;
    gap:70px;

    position:relative;
    overflow:hidden;

    background:var(--cream);
}

.hero::before{
    content:"ZERO";

    position:absolute;
    right:-60px;
    bottom:-80px;

    font-size:27vw;
    line-height:.7;

    font-weight:700;

    color:rgba(48,60,52,.035);

    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
}

.eyebrow{
    color:var(--brown);

    font-size:9px;
    letter-spacing:4px;

    margin-bottom:25px;
}

.hero h1{
    font-family:"Playfair Display",serif;

    font-size:clamp(80px,11vw,155px);

    line-height:.78;

    letter-spacing:-7px;

    font-weight:500;
}

.hero h1 span{
    color:var(--brown);
}

.hero-description{
    max-width:430px;

    margin-top:48px;

    color:#70746e;

    font-size:14px;
}

.hero-bottom{
    margin-top:35px;

    display:flex;
    align-items:center;

    gap:40px;
}

.explore{
    display:flex;
    align-items:center;
    gap:20px;

    padding-bottom:8px;

    border-bottom:1px solid var(--text);

    font-size:9px;
    letter-spacing:2px;

    transition:.3s;
}

.explore span{
    transition:.3s;
}

.explore:hover{
    color:var(--brown);
    border-color:var(--brown);
}

.explore:hover span{
    transform:translateX(4px);
}

.hero-photo{
    position:relative;
    z-index:2;

    max-width:500px;

    margin-left:auto;
}

.hero-photo::after{
    content:"";

    position:absolute;

    top:18px;
    left:18px;

    width:100%;
    height:100%;

    border:1px solid var(--brown2);

    z-index:-1;
}

.hero-photo img{
    aspect-ratio:4/5;

    object-fit:cover;

    background:#ddd6ca;
}

.photo-label{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:18px;

    color:white;

    font-size:8px;
    letter-spacing:2px;

    background:linear-gradient(
        transparent,
        rgba(20,25,21,.7)
    );
}


/* =========================
   MARQUEE
========================= */

.marquee{
    overflow:hidden;

    background:var(--dark);

    color:#eee9df;

    padding:19px 0;
}

.marquee-track{
    display:flex;
    align-items:center;

    width:max-content;

    gap:25px;

    animation:move 28s linear infinite;
}

.marquee span{
    font-size:9px;
    letter-spacing:4px;
}

.marquee i{
    color:var(--brown2);
    font-style:normal;
}

@keyframes move{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-30%);
    }

}


/* =========================
   SECTION HEADER
========================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding-bottom:20px;

    border-bottom:1px solid var(--line);

    margin-bottom:70px;
}

.section-dark .section-head{
    border-color:rgba(255,255,255,.15);
}

.section-head span{
    font-size:9px;
    letter-spacing:3px;
    font-weight:700;
}

.section-head small{
    font-size:8px;
    letter-spacing:2px;
    color:var(--muted);
}

.section-dark .section-head small{
    color:#aab2ab;
}


/* =========================
   ABOUT
========================= */

.about-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;
}

.big-title{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;

    letter-spacing:-3px;
}

.about-text{
    padding-top:5px;
}

.about-text .lead{
    font-size:20px;

    line-height:1.5;

    margin-bottom:25px;

    color:var(--text);
}

.about-text p{
    color:var(--muted);

    font-size:14px;

    margin-bottom:20px;
}

.line{
    width:65px;
    height:1px;

    background:var(--brown);

    margin:35px 0;
}

.info-mini{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:25px;
}

.info-mini span{
    display:block;

    font-size:8px;
    letter-spacing:2px;

    color:var(--muted);

    margin-bottom:6px;
}

.info-mini strong{
    font-size:13px;
}


/* =========================
   CREATOR
========================= */

.creator-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;
}

.creator-title h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;

    letter-spacing:-3px;
}

.creator-title p{
    color:#adb5ae;

    max-width:430px;

    font-size:14px;

    margin-top:30px;
}

.creator-data{
    border-top:1px solid rgba(255,255,255,.16);
}

.data-row{
    display:grid;

    grid-template-columns:130px 1fr;

    padding:20px 0;

    border-bottom:1px solid rgba(255,255,255,.16);
}

.data-row span{
    color:#929d95;

    font-size:8px;

    letter-spacing:2px;
}

.data-row strong{
    font-size:14px;

    font-weight:500;
}


/* =========================
   ARTWORK
========================= */

.artwork-intro{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;

    margin-bottom:70px;
}

.artwork-intro p{
    align-self:end;

    color:var(--muted);

    max-width:430px;

    font-size:14px;
}

.main-artwork{
    display:grid;

    grid-template-columns:1.35fr .65fr;

    background:var(--paper);
}

.main-artwork-image{
    position:relative;

    overflow:hidden;
}

.main-artwork-image img{
    height:100%;

    min-height:600px;

    object-fit:cover;

    transition:1s ease;
}

.main-artwork:hover img{
    transform:scale(1.025);
}

.art-number{
    position:absolute;

    top:18px;
    left:18px;

    padding:8px 10px;

    background:rgba(250,248,243,.9);

    font-size:8px;
    letter-spacing:2px;
}

.artwork-info{
    padding:50px 42px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.artwork-info .label{
    color:var(--brown);

    font-size:8px;

    letter-spacing:3px;
}

.artwork-info h3{
    font-family:"Playfair Display",serif;

    font-size:39px;

    line-height:1.05;

    margin:20px 0;
}

.artwork-info p{
    color:var(--muted);

    font-size:13px;
}

.tags{
    display:flex;
    flex-wrap:wrap;

    gap:7px;

    margin-top:30px;
}

.tags span{
    padding:7px 9px;

    border:1px solid var(--line);

    font-size:7px;

    letter-spacing:1.5px;
}

.art-gallery{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:14px;

    margin-top:14px;
}

.art-item{
    position:relative;

    overflow:hidden;

    aspect-ratio:1/1;

    background:#ddd5c8;
}

.art-item img{
    height:100%;

    object-fit:cover;

    transition:.7s ease;
}

.art-item:hover img{
    transform:scale(1.05);
}

.art-item span{
    position:absolute;

    left:12px;
    bottom:12px;

    padding:6px 8px;

    color:white;

    background:rgba(30,35,31,.7);

    font-size:8px;
}


/* =========================
   CONCEPT
========================= */

.concept-title{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;

    margin-bottom:60px;
}

.concept-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    border-top:1px solid rgba(32,37,33,.15);
}

.concept-card{
    padding:40px 30px;

    border-right:1px solid rgba(32,37,33,.15);
}

.concept-card:last-child{
    border-right:none;
}

.concept-number{
    color:var(--brown);

    font-size:9px;

    letter-spacing:2px;

    margin-bottom:60px;
}

.concept-card h3{
    font-family:"Playfair Display",serif;

    font-size:30px;

    margin-bottom:12px;
}

.concept-card p{
    color:#6e726c;

    max-width:280px;

    font-size:13px;
}


/* =========================
   MATERIALS
========================= */

.material-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;
}

.material-title h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;
}

.material-title p{
    color:var(--muted);

    max-width:400px;

    margin-top:30px;

    font-size:14px;
}

.material-list{
    border-top:1px solid var(--line);
}

.material{
    display:grid;

    grid-template-columns:40px 1fr 80px;

    align-items:center;

    padding:18px 0;

    border-bottom:1px solid var(--line);
}

.material span{
    color:var(--brown);

    font-size:8px;
}

.material strong{
    font-size:13px;

    font-weight:500;
}

.material small{
    text-align:right;

    color:#858880;

    font-size:7px;

    letter-spacing:1.5px;
}


/* =========================
   PROCESS
========================= */

.process-title{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;

    margin-bottom:65px;
}

.process-title h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;
}

.process-title p{
    color:#adb5ae;

    max-width:420px;

    align-self:end;

    font-size:14px;
}

.process-list{
    border-top:1px solid rgba(255,255,255,.16);
}

.process{
    display:grid;

    grid-template-columns:90px 1fr;

    gap:45px;

    padding:30px 0;

    border-bottom:1px solid rgba(255,255,255,.16);
}

.process-number{
    color:var(--brown2);

    font-family:"Playfair Display",serif;

    font-size:30px;
}

.process h3{
    font-size:18px;

    font-weight:500;

    margin-bottom:5px;
}

.process p{
    color:#adb5ae;

    font-size:13px;

    max-width:620px;
}


/* =========================
   VIDEOS
========================= */

.video-title{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;

    margin-bottom:60px;
}

.video-title h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;
}

.video-title p{
    color:var(--muted);

    align-self:end;

    max-width:430px;

    font-size:14px;
}

.video-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;
}

.video-card{
    position:relative;

    background:var(--paper);

    border:1px solid var(--line);

    overflow:hidden;
}

.video-card video{
    aspect-ratio:9/13;

    object-fit:cover;

    background:#222a25;
}

.video-no{
    position:absolute;

    z-index:2;

    top:12px;
    left:12px;

    padding:7px 9px;

    background:rgba(250,248,243,.9);

    font-size:8px;

    letter-spacing:1px;
}

.video-caption{
    padding:18px 20px 22px;
}

.video-caption span{
    color:var(--brown);

    font-size:7px;

    letter-spacing:2px;
}

.video-caption h3{
    font-size:14px;

    margin-top:5px;

    font-weight:500;
}


/* =========================
   PACKAGING
========================= */

.packaging-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;
}

.packaging-title h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;
}

.packaging-title span{
    color:var(--brown);

    font-size:9px;

    letter-spacing:3px;
}

.packaging-text{
    align-self:center;
}

.packaging-text p{
    color:#6f736d;

    font-size:14px;

    margin-bottom:22px;
}

.packaging-text .lead{
    color:var(--text);

    font-size:20px;

    line-height:1.5;
}


/* =========================
   VALUE
========================= */

.value h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(58px,8vw,105px);

    line-height:.88;

    letter-spacing:-4px;

    margin-bottom:30px;
}

.value p{
    color:var(--muted);

    max-width:600px;

    font-size:15px;
}


/* =========================
   BUSINESS
========================= */

.business-title{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;

    margin-bottom:65px;
}

.business-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:15px;
}

.business-card{
    min-height:250px;

    padding:30px;

    border:1px solid rgba(255,255,255,.15);

    transition:.3s ease;
}

.business-card:hover{
    transform:translateY(-4px);

    background:rgba(255,255,255,.035);
}

.business-card span{
    color:#98a29b;

    font-size:8px;

    letter-spacing:2px;
}

.business-card h3{
    font-family:"Playfair Display",serif;

    font-size:28px;

    margin:18px 0 10px;
}

.business-card strong{
    display:block;

    color:var(--brown2);

    font-family:"Playfair Display",serif;

    font-size:32px;

    font-weight:400;

    margin-bottom:12px;
}

.business-card p{
    color:#adb5ae;

    font-size:12px;
}

.business-details{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:50px;

    margin-top:60px;

    padding-top:30px;

    border-top:1px solid rgba(255,255,255,.15);
}

.business-details span{
    color:var(--brown2);

    display:block;

    font-size:8px;

    letter-spacing:2px;

    margin-bottom:8px;
}

.business-details p{
    color:#adb5ae;

    font-size:12px;
}


/* =========================
   MEANING
========================= */

.meaning-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:100px;
}

.meaning-grid h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(52px,6vw,82px);

    line-height:.9;
}

.meaning-text{
    align-self:center;
}

.meaning-text p{
    color:var(--muted);

    font-size:14px;

    margin-bottom:20px;
}

.meaning-text .lead{
    color:var(--text);

    font-size:21px;

    line-height:1.5;
}


/* =========================
   CLOSING
========================= */

.closing{
    min-height:75vh;

    display:flex;

    align-items:center;

    position:relative;

    overflow:hidden;
}

.closing::before{
    content:"ZERO";

    position:absolute;

    right:-70px;
    bottom:-70px;

    font-size:28vw;

    line-height:.7;

    color:rgba(255,255,255,.025);

    font-weight:700;
}

.closing-content{
    position:relative;

    z-index:2;
}

.closing-label{
    color:var(--brown2);

    font-size:9px;

    letter-spacing:3px;
}

.closing h2{
    font-family:"Playfair Display",serif;

    font-size:clamp(60px,9vw,125px);

    line-height:.82;

    letter-spacing:-5px;

    margin:25px 0 35px;
}

.closing p{
    color:#adb5ae;

    max-width:480px;

    font-size:14px;
}

.top{
    display:inline-block;

    margin-top:45px;

    padding-bottom:8px;

    border-bottom:1px solid rgba(255,255,255,.4);

    font-size:8px;

    letter-spacing:2px;

    transition:.3s;
}

.top:hover{
    color:var(--brown2);

    border-color:var(--brown2);
}


/* =========================
   FOOTER
========================= */

footer{
    background:#1b211d;

    color:white;

    padding:60px 5% 25px;
}

.footer-top{
    display:flex;

    justify-content:space-between;

    padding-bottom:50px;

    border-bottom:1px solid rgba(255,255,255,.12);
}

.footer-logo{
    font-family:"Playfair Display",serif;

    font-size:52px;

    line-height:.8;
}

.footer-logo span{
    color:var(--brown2);
}

.footer-info{
    display:flex;

    gap:70px;
}

.footer-info span{
    display:block;

    color:#89938c;

    font-size:7px;

    letter-spacing:2px;

    margin-bottom:7px;
}

.footer-info p{
    color:#c2c8c3;

    font-size:11px;
}

.footer-bottom{
    display:flex;

    justify-content:space-between;

    padding-top:20px;

    color:#858d87;

    font-size:8px;

    letter-spacing:1px;
}

.footer-bottom a:hover{
    color:var(--brown2);
}


/* =========================
   ANIMATION
========================= */

.reveal{
    opacity:0;

    transform:translateY(28px);

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.7,.2,1);
}

.reveal.show{
    opacity:1;

    transform:translateY(0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    section{
        padding:85px 0;
    }

    .navbar{
        height:65px;
    }

    .nav-links,
    .nav-year{
        display:none;
    }

    .hero{
        padding:120px 7% 75px;

        grid-template-columns:1fr;

        gap:60px;
    }

    .hero h1{
        font-size:72px;

        letter-spacing:-4px;
    }

    .hero-description{
        margin-top:35px;
    }

    .hero-photo{
        width:88%;

        margin:auto;
    }

    .about-grid,
    .creator-grid,
    .artwork-intro,
    .material-grid,
    .process-title,
    .video-title,
    .packaging-grid,
    .meaning-grid{
        grid-template-columns:1fr;

        gap:45px;
    }

    .main-artwork{
        grid-template-columns:1fr;
    }

    .main-artwork-image img{
        min-height:430px;
    }

    .artwork-info{
        padding:38px 25px 45px;
    }

    .art-gallery{
        grid-template-columns:1fr 1fr;
    }

    .concept-grid{
        grid-template-columns:1fr;
    }

    .concept-card{
        border-right:0;

        border-bottom:1px solid rgba(32,37,33,.15);
    }

    .concept-card:last-child{
        border-bottom:0;
    }

    .video-grid{
        grid-template-columns:1fr 1fr;
    }

    .business-grid,
    .business-details{
        grid-template-columns:1fr;
    }

    .business-details{
        gap:25px;
    }

    .process{
        grid-template-columns:55px 1fr;

        gap:20px;
    }

    .footer-top{
        display:block;
    }
